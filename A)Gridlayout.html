<html>
    <head>
        <title>Bs-Grid</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </head>
    <body>
        <div class="h1 text-center text-white bg-primary">Grid System </div>
        <div class="container mt-4">
            <div class="row">
                <div class="col-12 border border-primary mt-3 text-center">column -12 </div>
            </div>
            <div class="row">
                <div class="col-6 border border-secondary mt-3  text-center">column - 6</div>
                <div class="col-6 border border-secondary mt-3  text-center">column - 6</div>
            </div> 
            <div class="row">
                <div class="col-4 border border-warning mt-3  text-center">column - 4</div>
                <div class="col-8 border border-warning mt-3  text-center">column - 8</div>
            </div>
            <div class="row">
                <div class="col-8 border border-success mt-3 text-center">column -8</div>
                <div class="col-4 border border-success mt-3  text-center">column - 4</div>
            </div>
             <div class="row">
                <div class="col-10 border border-danger mt-3 text-center">column -10</div>
                <div class="col-2 border border-danger mt-3  text-center">column - 2</div>
            </div>
            <div class="row">
                 <div class="col-8 border border-info mt-3 text-center">column -8</div>
                 <div class="col-2 border border-info mt-3 text-center">column -2</div>
                 <div class="col-1 border border-info mt-3 text-center">column -1</div>
                 <div class="col-1 border border-info mt-3 text-center">column -1</div>
            </div>
            <div class="row  text-center">
                <div class="col-1 border border-dark mt-3">column -1</div>
                <div class="col-1 border border-dark mt-3">column - 1</div>
                <div class="col-1 border border-dark mt-3">column - 1</div>
                <div class="col-1 border border-dark mt-3">column - 1</div>
                <div class="col-1 border border-dark mt-3">column - 1</div>
                <div class="col-1 border border-dark mt-3">column - 1</div>
                <div class="col-1 border border-dark mt-3">column - 1</div>
                <div class="col-1 border border-dark mt-3">column - 1</div>
                <div class="col-1 border border-dark mt-3">column - 1</div>
                <div class="col-1 border border-dark mt-3">column - 1</div>
                <div class="col-1 border border-dark mt-3">column - 1</div>
                <div class="col-1 border border-dark mt-3">column - 1</div>
            </div>
        </div>
    </body>
</html>
