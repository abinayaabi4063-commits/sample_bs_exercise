<html>
    <head>
        <title>text Color Property </title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </head>
    <body>
          <div class="container"></div>
            <div class="h1 text-secondary">Hello welcome to Bs world</div>
            <div class="h2 text-dark">Hello welcome to Bs world</div>
            <div class="h3 text-danger">Hello welcome to Bs world</div>
            <div class="h4 text-warning">Hello welcome to Bs world</div>
            <div class="h5 text-primary">Hello welcome to Bs world</div>
        </div>
    </body>
</html>
