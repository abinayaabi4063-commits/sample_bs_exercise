<html>
<head>
    <title> forms-validation </title>
    <meta name="viewport" content="width=device-width initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="h1 text-center text-white bg-secondary"> Form</div>
    <div class="container">
        <form>
            <div class="mb-3">
                <label class="form-label" for="firstName">Candidate Name</label>
                <input type="text" class="form-control" id="firstName" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="lastName">Candidate Last Name</label>
                <input type="text" class="form-control" id="lastName" required>
            </div>
            <div class="mt-3">
                <button type="submit" class="btn btn-secondary">Submit</button>
            </div>
        </form>
    </div>
</body>
</html>
