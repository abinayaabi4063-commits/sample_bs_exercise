<html>
    <head>
        <title>BootStrap Tutorial -Display Text Property </title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </head>
    <body>
       <div class="container-fluid bg-secondary text-white text-center">
            <p class="title h3">Text Align</p>
       </div>
       <div class="container ">
            <div class="text-start">Text Starting </div>
            <div class="text-center">Text Center</div>
            <div class="text-end">Text end</div>
       </div>
       <div class="container-fluid bg-secondary text-white">
            <p class="title h3">Font weight Styles</p>
       </div>
       <div class="container ">
            <div class="fw-normal">Normal font</div>
            <div class="fw-bold">Bold font </div>
            <div class="fw-italic">Italic font</div>
            <div class="fw-light ">light font</div>
       </div>
        <div class="container-fluid bg-secondary text-white">
            <p class="title h3">Font size</p>
       </div>
       <div class="container">
            <div class="fs-0">f level 0 </div>
            <div class="fs-1">f level 1 </div>
            <div class="fs-2">f level 2</div>
            <div class="fs-3">f level 3</div>
            <div class="fs-4">f level 4</div>
            <div class="fs-5">f level 5</div>
       </div>
    </body>
